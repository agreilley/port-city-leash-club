<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Updated - Port City Leash Club</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0D1B2A 0%, #1a2a3a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .confirm-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      text-align: center;
    }

    .brand-logo {
      height: 56px;
      width: auto;
      margin-bottom: 24px;
    }

    .brand-eyebrow {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #8FA8A2;
    }

    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e8f5e9;
      border: 0.5px solid #4caf50;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .success-icon svg {
      width: 28px;
      height: 28px;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      color: #0D1B2A;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    .home-link {
      display: inline-block;
      margin-top: 24px;
      font-size: 13px;
      color: #C17B6F;
      text-decoration: none;
    }

    .home-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="confirm-container">
    <img class="brand-logo" src="images/logo-horizontal.png" alt="Port City Leash Club">
    <div class="brand-eyebrow">Port City Leash Club</div>

    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>Password Updated</h1>
    <p>
      Your Port City Leash Club password has been updated. You can now return to
      the login page and sign in with your new password.
    </p>

    <a class="home-link" href="index.html">Return to portcityleashclub.com</a>
  </div>
</body>
</html>
