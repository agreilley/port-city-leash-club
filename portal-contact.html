<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - The Leash Club</title>
  <!-- Render-blocking on purpose — see js/portal-guard.css's own header for
       why this can't be JS-injected without reintroducing a chrome flash. -->
  <link rel="stylesheet" href="/js/portal-guard.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #f5f3ed;
      color: #0D1B2A;
    }

    .portal-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #0D1B2A;
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .sidebar-logo {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      color: white;
      transition: opacity 0.2s;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #8FA8A2;
      text-decoration: none;
      transition: all 0.2s;
      display: block;
      white-space: nowrap;
      line-height: 1.4;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      padding: 12px 12px;
      background: #C17B6F;
      color: white;
    }

    .sidebar-pet {
      border-top: 0.5px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      color: #8FA8A2;
      font-size: 13px;
    }

    .pet-name {
      margin-bottom: 8px;
      font-weight: 500;
    }

    .pet-info {
      font-size: 12px;
      opacity: 0.8;
    }

    .btn-signout {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-signout:hover { border-color: rgba(255,255,255,0.4); color: white; }

    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      max-width: 900px;
    }

    .page-header {
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 26px;
      font-weight: 500;
      color: #0D1B2A;
      margin-bottom: 6px;
    }
    .page-header p {
      font-size: 14px;
      color: #7A7A7A;
    }

    .contact-card {
      background: white;
      border-radius: 12px;
      border: 0.5px solid #ddd;
      max-width: 560px;
      padding: 32px;
    }

    .known-fields {
      display: flex;
      gap: 24px;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .known-field-label {
      font-size: 11px;
      color: #7A7A7A;
      margin-bottom: 3px;
    }
    .known-field-value {
      font-size: 14px;
      color: #0D1B2A;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      font-weight: 500;
    }

    select, textarea {
      width: 100%;
      padding: 10px;
      border: 0.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #0D1B2A;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn-submit {
      background: #C17B6F;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #b06a60; }
    .btn-submit:disabled { background: #ddd; color: #888; cursor: not-allowed; }

  /* ── PORTAL MOBILE ─────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    html, body { overflow-x: hidden; }
    .sidebar { display: none !important; }
    .portal-container { display: block !important; }
    .main-content { margin-left: 0 !important; padding: 20px 16px !important; }
    .page-header h1 { font-size: 22px; }
    .contact-card { padding: 20px; max-width: 100%; }
    .known-fields { flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>
  <div class="portal-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">The Leash Club</div>
      <nav class="sidebar-nav">
        <a href="portal-dashboard.html" class="nav-item">Dashboard</a>
        <a href="portal-pet-profile.html" class="nav-item">Pet Profile</a>
        <a href="portal-walk-history.html" class="nav-item">Care History</a>
        <a href="portal-extras.html" class="nav-item">Additional Care</a>
        <a href="portal-referrals.html" class="nav-item">Refer a Friend</a>
        <a href="portal-account.html" class="nav-item active">Account</a>
      </nav>
      <div class="sidebar-pet">
        <div id="sidebarPets">
          <div class="pet-name" id="sidebarPetName">Scout</div>
          <div class="pet-info" id="sidebarPetInfo">Golden Retriever • 5 years old</div>
        </div>
      </div>
      <div style="margin-top:auto;">
        <button class="btn-signout" onclick="signOutMember()">Log Out</button>
        <a href="index.html" style="display:flex;justify-content:center;padding:16px 12px 20px;border-top:1px solid rgba(255,255,255,0.08);text-decoration:none;"><img src="../images/logo-square.png" alt="Port City Leash Club" style="height:auto;width:100%;max-width:93px;filter:invert(1) sepia(1) saturate(0.3) brightness(1.1);opacity:1;"></a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="page-header">
        <h1>Contact Us</h1>
        <p>Have a question or something you need help with? Send it straight to us — we'll get back to you within 24 hours.</p>
      </div>

      <!-- Post-submit status banner mounts here (above the form, so it stays visible after the form hides on success) -->
      <div data-status-container></div>

      <div class="contact-card">
        <div class="known-fields">
          <div>
            <div class="known-field-label">Name</div>
            <div class="known-field-value" id="contactName">–</div>
          </div>
          <div>
            <div class="known-field-label">Email</div>
            <div class="known-field-value" id="contactEmail">–</div>
          </div>
        </div>

        <div id="contact-form">
          <div class="form-group">
            <label for="contactTopic">What's this about?</label>
            <select id="contactTopic">
              <option value="">Select a topic</option>
              <option>Billing question</option>
              <option>Membership question</option>
              <option>Schedule or walk day change</option>
              <option>My walker or a recent visit</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="form-group">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" placeholder="How can we help?"></textarea>
          </div>
          <div id="contactError" style="display:none;color:#C17B6F;font-size:13px;margin-bottom:12px;"></div>
          <button class="btn-submit" id="contactSubmitBtn" onclick="submitPortalContact()">Send Message</button>
        </div>
      </div>
    </div>
  </div>

<script type="module" src="/js/portal-nav.js"></script>
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeAuth, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { initializeFirestore, memoryLocalCache, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { showSuccess, showError } from '/js/status.js';
import { requireMemberDoc, showPortalLoadTimeout } from '/js/portal-guard.js';
const cfg = { apiKey:"AIzaSyCMP5mj12VkvaOeJ6CXFujycPjwFrD85RM", authDomain:"port-city-leash-club-827ab.firebaseapp.com", projectId:"port-city-leash-club-827ab", storageBucket:"port-city-leash-club-827ab.firebasestorage.app", messagingSenderId:"649385306352", appId:"1:649385306352:web:8e8a6fcbe8a7eff29dfa35" };
const app = getApps().find(a => a.name === 'member-app') || initializeApp(cfg, 'member-app');
// Explicit persistence fallback chain — the SDK's default hierarchy probes
// IndexedDB first, which hangs (never resolves, never rejects) under Safari
// Private Browsing instead of failing fast. This skips straight to
// localStorage-backed persistence, falling back further only if unavailable.
const auth = initializeAuth(app, {
  persistence: [browserLocalPersistence, browserSessionPersistence, inMemoryPersistence]
});
// Firestore already defaults to memory-only cache with no persistence
// configured; making it explicit documents the choice on purpose.
const db = initializeFirestore(app, { localCache: memoryLocalCache() });
let userId = null, memberData = null;
window.signOutMember = () => signOut(auth).then(() => window.location.href = 'portal-login.html');

// If auth never resolves, OR resolves but the members/{uid} lookup inside
// requireMemberDoc hangs (flaky connection), stop waiting and show a retry
// state instead of leaving the member stuck on the guard's loading
// placeholder forever.
let authResolved = false;
const authTimeoutId = setTimeout(() => {
  if (!authResolved) showPortalLoadTimeout();
}, 10000);

onAuthStateChanged(auth, async (user) => {
  if (!user) { authResolved = true; clearTimeout(authTimeoutId); window.location.href = 'portal-login.html'; return; }
  userId = user.uid;
  memberData = await requireMemberDoc(db, user.uid);
  authResolved = true;
  clearTimeout(authTimeoutId);
  if (!memberData) return;
  updateSidebar();
  document.getElementById('contactName').textContent = memberData.name || '–';
  document.getElementById('contactEmail').textContent = memberData.email || '–';
});

function updateSidebar() {
  if (!memberData) return;
  const dogs = memberData.dogs?.length ? memberData.dogs : [{ name: memberData.dogName, breed: memberData.petBreed, age: memberData.petAge ? memberData.petAge + ' years' : '' }];
  // esc() — HTML-escape user-controlled dog fields before innerHTML (L-1)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const formatDogAge = age => {
    const trimmed = String(age).trim();
    const n = /^\d+$/.test(trimmed) ? parseInt(trimmed, 10) : null;
    return n !== null ? `${n} year${n === 1 ? '' : 's'} old` : `${trimmed} old`;
  };
  const el = document.getElementById('sidebarPets');
  if (el) el.innerHTML = dogs.map(d => {
    const info = [esc(d.breed), d.age ? esc(formatDogAge(d.age)) : ''].filter(Boolean).join(' • ');
    return '<div style="margin-bottom:10px;"><div class="pet-name">' + esc(d.name||'') + '</div><div class="pet-info">' + info + '</div></div>';
  }).join('');
}

window.submitPortalContact = async () => {
  const errEl = document.getElementById('contactError');
  const btn = document.getElementById('contactSubmitBtn');
  errEl.style.display = 'none';

  const topic = document.getElementById('contactTopic').value;
  const message = document.getElementById('contactMessage').value.trim();
  if (!message) {
    errEl.textContent = 'Please enter a message.';
    errEl.style.display = 'block';
    return;
  }
  if (!userId) return;

  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    // Same shape as contact.html's public form (type: 'contact'), which is
    // what onNewSubmission (functions/index.js) keys off to send the admin
    // alert — no separate function needed for this to reach the inbox.
    // memberId included so the alert/admin request view can link straight
    // back to this member, unlike the public form's anonymous submissions.
    await addDoc(collection(db, 'submissions'), {
      type: 'contact',
      memberId: userId,
      name: memberData?.name || '',
      email: memberData?.email || '',
      topic,
      message,
      read: false,
      createdAt: serverTimestamp(),
    });
    showSuccess("Message sent — we'll be in touch within 24 hours.");
    document.getElementById('contactTopic').value = '';
    document.getElementById('contactMessage').value = '';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Message';
  }
};
</script>
</body>
</html>
