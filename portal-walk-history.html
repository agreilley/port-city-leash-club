<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <title>Care History - Port City Leash Club</title>
  <!-- Render-blocking on purpose — see js/portal-guard.css's own header for
       why this can't be JS-injected without reintroducing a chrome flash. -->
  <link rel="stylesheet" href="/js/portal-guard.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f5f3ed;
      color: #0D1B2A;
    }

    .portal-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #0D1B2A;
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .sidebar-logo {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      font-weight: 500;
      color: white;
      
      transition: opacity 0.2s;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      
      color: #8FA8A2;
      text-decoration: none;
      transition: all 0.2s;
      display: block;
      white-space: nowrap;
      line-height: 1.4;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      padding: 12px 12px;
      background: #C17B6F;
      color: white;
    }

    .sidebar-pet {
      border-top: 0.5px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      color: #8FA8A2;
      font-size: 13px;
    }

    .pet-name {
      margin-bottom: 8px;
      font-weight: 500;
    }

    .pet-info {
      font-size: 12px;
      opacity: 0.8;
    }

    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      max-width: 900px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 14px;
      color: #888;
    }

    /* Filter Buttons */
    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid #E5E0D8;
      background: white;
      border-radius: 6px;
      font-size: 13px;
      
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #C17B6F;
      color: white;
      border-color: #C17B6F;
    }

    /* Visit Report Card */
    .visit-report {
      background: #FAF8F4;
      border: 1px solid #E5E0D8;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(13, 27, 42, 0.04);
    }

    .report-header {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .walker-avatar {
      width: 56px;
      height: 56px;
      background: rgba(193, 123, 111, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .walker-info {
      flex: 1;
    }

    .walker-name {
      font-weight: 600;
      font-size: 15px;
      color: #0D1B2A;
      margin-bottom: 2px;
    }

    .walker-role {
      font-size: 12px;
      color: #7A7A7A;
    }

    .walker-badge {
      font-size: 11px;
      background: rgba(193, 123, 111, 0.2);
      color: #C17B6F;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 4px;
      display: inline-block;
    }

    .report-date {
      text-align: right;
      font-size: 13px;
      color: #7A7A7A;
    }

    /* Report Content */
    .report-content {
      margin-bottom: 20px;
    }

    .report-text {
      font-size: 14px;
      color: #4A4A4A;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .report-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    .meta-item {
      font-size: 12px;
      color: #7A7A7A;
    }

    .meta-value {
      font-weight: 600;
      color: #0D1B2A;
      font-size: 14px;
    }

    /* Photos */
    .report-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .photo-item {
      aspect-ratio: 1;
      background: rgba(193, 123, 111, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
      transition: all 0.2s;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-item:hover {
      box-shadow: 0 4px 12px rgba(13, 27, 42, 0.1);
    }

    /* Record type badge — the one visual cue distinguishing a walk card
       from an overnight/check-in visit card in the merged list. */
    .record-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    .record-badge.walk { background: rgba(26, 92, 48, 0.12); color: #1A5C30; }
    .record-badge.visit { background: rgba(193, 123, 111, 0.15); color: #C17B6F; }

    /* Deep-link target (?walk=... or ?overnight=...&visit=...) — a
       temporary highlight so a member arriving from a text/email link can
       find the specific record among everything else on the page. */
    .visit-report.deep-link-highlight {
      border-color: #C17B6F;
      box-shadow: 0 0 0 3px rgba(193, 123, 111, 0.25);
    }

    /* Notes */
    .report-notes {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #E5E0D8;
      font-size: 13px;
      color: #4A4A4A;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .notes-label {
      font-weight: 500;
      color: #0D1B2A;
      font-size: 12px;
      margin-bottom: 6px;
    }

    /* View Details Button */
    .view-details-btn {
      background: white;
      border: 1px solid #E5E0D8;
      padding: 10px 16px;
      border-radius: 6px;
      
      font-size: 13px;
      color: #0D1B2A;
      font-weight: 500;
      transition: all 0.2s;
    }

    .view-details-btn:hover {
      background: #FAF8F4;
      box-shadow: 0 2px 6px rgba(13, 27, 42, 0.08);
    }

    /* Empty State */
    .empty-state {
      background: #FAF8F4;
      border: 1px solid #E5E0D8;
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      color: #7A7A7A;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .report-meta {
        grid-template-columns: repeat(2, 1fr);
      }

      .report-photos {
        grid-template-columns: repeat(2, 1fr);
      }

      .filter-buttons {
        flex-wrap: wrap;
      }
    }
  
  /* ── PORTAL MOBILE ─────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    html, body { overflow-x: hidden; }

    /* Hide sidebar, expand main — the shared drawer (js/portal-nav.js)
       takes over navigation below this same breakpoint. */
    .sidebar { display: none !important; }
    .portal-container { display: block !important; }
    .main-content { margin-left: 0 !important; padding: 20px 16px !important; }
    .main { margin-left: 0 !important; }
    .content { padding: 20px 16px !important; }

    /* Cards + tables */
    .stats-row { grid-template-columns: 1fr 1fr !important; gap: 10px; }
    .stat-card { padding: 16px; }
    .stat-value { font-size: 28px; }
    table { font-size: 12px; }
    th, td { padding: 10px 10px; }
    .table-search { width: 100%; }
    .table-header { flex-direction: column; align-items: flex-start; gap: 10px; }

    /* Calendar */
    .calendar-day { min-height: 60px; padding: 4px; }
    .day-num { font-size: 11px; width: 20px; height: 20px; }
    .walk-chip { font-size: 9px; padding: 1px 3px; }
    .calendar-weekday { font-size: 9px; padding: 6px 2px; }
    .calendar-legend { flex-wrap: wrap; gap: 8px; }

    /* Forms */
    .form-grid { grid-template-columns: 1fr !important; }
    .form-field { grid-column: 1 !important; }
    .form-shell { grid-template-columns: 1fr !important; }
    .order-sidebar { position: static !important; }
    .summary-card { margin-top: 0; }

    /* Walk cards */
    .walk-card { padding: 14px 16px; gap: 12px; }
    .walk-date-day { font-size: 22px; }

    /* Membership upgrade */
    .plans-grid { grid-template-columns: 1fr !important; }
    .plan-option { padding: 18px; }

    /* Layout helpers */
    .layout { grid-template-columns: 1fr !important; }
    .form-section { padding: 20px 16px !important; }
    .page-header { margin-bottom: 20px; }
    .page-header h1 { font-size: 24px; }
  }

  .btn-signout {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5);
    border-radius: 4px;
    padding: 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-signout:hover { border-color: rgba(255,255,255,0.4); color: white; }
</style>

<body>
  <div class="portal-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">The Leash Club</div>
      <nav class="sidebar-nav">
        <a href="portal-dashboard.html" class="nav-item">Dashboard</a>
        <a href="portal-pet-profile.html" class="nav-item">Pet Profile</a>
        <a href="portal-walk-history.html" class="nav-item active">Care History</a>
        <a href="portal-extras.html" class="nav-item">Additional Care</a>
        <a href="portal-referrals.html" class="nav-item">Refer a Friend</a>
        <a href="portal-account.html" class="nav-item">Account</a>
      </nav>
      <div class="sidebar-pet">
        <div id="sidebarPets">
          <div class="pet-name" id="sidebarPetName">Scout</div>
          <div class="pet-info" id="sidebarPetInfo">Golden Retriever • 5 years old</div>
        </div>
      </div>
      <div style="margin-top:auto;">
        <button class="btn-signout" onclick="signOutMember()">Log Out</button>
        <a href="index.html" style="display:flex;justify-content:center;padding:16px 12px 20px;border-top:1px solid rgba(255,255,255,0.08);text-decoration:none;"><img src="../images/logo-square.png" alt="Port City Leash Club" style="height:auto;width:100%;max-width:93px;filter:invert(1) sepia(1) saturate(0.3) brightness(1.1);opacity:1;"></a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="page-header">
        <h1 id="pageTitle" data-suffix="'s Care History">Your Pet's Care History</h1>
        <p id="pageSubtitle" data-prefix="" data-suffix="'s completed walks, overnight stays, and check-in visits">Your pet's completed walks, overnight stays, and check-in visits</p>
      </div>

      <!-- Filter Buttons -->
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterRecords('all', this)">All</button>
        <button class="filter-btn" onclick="filterRecords('month', this)">This month</button>
        <button class="filter-btn" onclick="filterRecords('last-month', this)">Last month</button>
      </div>

      <div id="walksContainer">
        <div style="text-align:center;padding:48px 24px;color:#7A7A7A;font-size:14px;">Loading care history…</div>
      </div>
    </div>
  </div>

  <script>
    // allRecords holds BOTH completed walks and completed overnight/check-in
    // visits, normalized to one shape so they can be merged into a single
    // reverse-chronological list instead of two stacked sections. `type`
    // ('walk' | 'visit') is what the merged renderer uses to pick the badge
    // and detail line; `sortDate`/`monthKey`/`yearKey` are plain JS values so
    // filtering/sorting never has to branch on Firestore-Timestamp-vs-string
    // per record.
    let allRecords = [];

    // Walk notes and visit notes are both free text written by a walker
    // (completeWalk()/completeVisit() in walker/dashboard.html) and rendered
    // here via innerHTML — unescaped, this is a stored-XSS path into a
    // member's own browser the moment they open this page. Same escaping
    // convention as esc() in walker/dashboard.html.
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    // Same fix as portal-pet-profile.html's own formatDogAge — age is free
    // text a member typed, so a plain number gets "years old" appended,
    // while anything already worded (e.g. "9 years", "Senior") is shown
    // exactly as typed rather than risking "X years years old".
    function formatDogAge(age) {
      const trimmed = String(age).trim();
      const n = /^\d+$/.test(trimmed) ? parseInt(trimmed, 10) : null;
      return n !== null ? `${n} year${n === 1 ? '' : 's'} old` : `${trimmed} old`;
    }

    function toJsDate(val) {
      return val?.toDate?.() || new Date(val);
    }

    function filterRecords(period, button) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      renderRecords(period);
    }

    function renderRecords(period = 'all') {
      const container = document.getElementById('walksContainer');
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      let filtered = allRecords;

      if (period === 'month') {
        filtered = filtered.filter(r => r.sortDate.getMonth() === currentMonth && r.sortDate.getFullYear() === currentYear);
      } else if (period === 'last-month') {
        const lm = currentMonth === 0 ? 11 : currentMonth - 1;
        const lmy = currentMonth === 0 ? currentYear - 1 : currentYear;
        filtered = filtered.filter(r => r.sortDate.getMonth() === lm && r.sortDate.getFullYear() === lmy);
      }

      // Single reverse-chronological sort across BOTH record types — a
      // member sees their week in order, not walks-then-visits. This is the
      // one sort call for the whole merged list; each type no longer sorts
      // independently the way allWalks used to.
      filtered.sort((a, b) => b.sortDate - a.sortDate);

      if (!filtered.length) {
        container.innerHTML = '<div style="text-align:center;padding:48px 24px;color:#7A7A7A;font-size:14px;">No completed care yet.</div>';
        return;
      }

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

      container.innerHTML = filtered.map(r => {
        const dateStr = monthNames[r.sortDate.getMonth()] + ' ' + r.sortDate.getDate() + ', ' + r.sortDate.getFullYear();
        const photoHtml = r.photoUrl
          ? '<div class="report-photos"><div class="photo-item"><img src="' + esc(r.photoUrl) + '" alt="Photo from ' + esc(r.badgeLabel) + '" loading="lazy"></div></div>'
          : '';
        return '<div class="visit-report" id="' + r.elementId + '" data-month="' + (r.sortDate.getMonth()+1) + '" data-year="' + r.sortDate.getFullYear() + '">' +
          '<div class="report-header">' +
          '<div class="walker-avatar">' + r.avatar + '</div>' +
          '<div class="walker-info">' +
          '<div class="walker-name">' + esc(r.walkerName) + '</div>' +
          '<div class="walker-role">' + esc(r.subLabel) + '</div>' +
          '<span class="record-badge ' + r.type + '">' + esc(r.badgeLabel) + '</span>' +
          '</div>' +
          '<div class="report-date">' + dateStr + '</div>' +
          '</div>' +
          '<div class="report-content">' +
          (r.note ? '<div class="report-text">' + esc(r.note) + '</div>' : '<div class="report-text" style="color:#aaa;font-style:italic;">' + esc(r.noNoteText) + '</div>') +
          photoHtml +
          '<div class="report-meta" style="margin-top:12px;font-size:13px;color:#7A7A7A;">' + esc(r.metaLine) + '</div>' +
          '</div>' +
          '</div>';
      }).join('');

      applyDeepLinkHighlight();
    }

    // ?walk={walkId} or ?overnight={overnightId}&visit={visitId} — scrolls
    // the matching card into view and highlights it. If the id isn't in
    // the currently-rendered set (wrong member, record doesn't exist, or
    // simply not completed yet), this is a silent no-op: the page still
    // shows the normal full list, no error state. Runs after every render
    // (not just on load) so switching the period filter re-checks in case
    // the deep-linked record is outside "This month"/"Last month".
    function applyDeepLinkHighlight() {
      const params = new URLSearchParams(location.search);
      const walkId = params.get('walk');
      const overnightId = params.get('overnight');
      const visitId = params.get('visit');
      const targetId = walkId ? ('record-walk-' + walkId)
        : (overnightId && visitId) ? ('record-visit-' + overnightId + '-' + visitId)
        : null;
      if (!targetId) return;
      const el = document.getElementById(targetId);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('deep-link-highlight');
    }
  </script>
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeAuth, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { initializeFirestore, memoryLocalCache, doc, getDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { showError } from '/js/status.js';
import { requireMemberDoc, showPortalLoadTimeout } from '/js/portal-guard.js';
import { WALK_TIME_SLOT_LABELS } from './time-slots.js';
import { VISIT_SLOT_LABELS } from './visit-slots.js';
const cfg = { apiKey:"AIzaSyCMP5mj12VkvaOeJ6CXFujycPjwFrD85RM", authDomain:"port-city-leash-club-827ab.firebaseapp.com", projectId:"port-city-leash-club-827ab", storageBucket:"port-city-leash-club-827ab.firebasestorage.app", messagingSenderId:"649385306352", appId:"1:649385306352:web:8e8a6fcbe8a7eff29dfa35" };
const app = getApps().find(a => a.name === 'member-app') || initializeApp(cfg, 'member-app');
// Explicit persistence fallback chain — the SDK's default hierarchy probes
// IndexedDB first, which hangs (never resolves, never rejects) under Safari
// Private Browsing instead of failing fast. This skips straight to
// localStorage-backed persistence, falling back further only if unavailable.
const auth = initializeAuth(app, {
  persistence: [browserLocalPersistence, browserSessionPersistence, inMemoryPersistence]
});
// Firestore already defaults to memory-only cache with no persistence
// configured; making it explicit documents the choice on purpose.
const db = initializeFirestore(app, { localCache: memoryLocalCache() });
window.signOutMember = () => signOut(auth).then(() => window.location.href = 'portal-login.html');

// If auth never resolves, OR resolves but the members/{uid} lookup inside
// requireMemberDoc hangs (flaky connection), stop waiting and show a retry
// state instead of leaving the member stuck on the guard's loading
// placeholder forever. One 10s budget covering both — cleared only once
// requireMemberDoc has actually settled below, not as soon as auth itself
// resolves.
let authResolved = false;
const authTimeoutId = setTimeout(() => {
  if (!authResolved) showPortalLoadTimeout();
}, 10000);

onAuthStateChanged(auth, async (user) => {
  if (!user) { authResolved = true; clearTimeout(authTimeoutId); window.location.href = 'portal-login.html'; return; }
  const m = await requireMemberDoc(db, user.uid);
  authResolved = true;
  clearTimeout(authTimeoutId);
  if (!m) { document.getElementById('walksContainer').innerHTML = ''; return; }
  try {
    const dogs = m.dogs?.length ? m.dogs : [{ name: m.dogName, breed: m.petBreed, age: m.petAge ? m.petAge + ' years' : '' }];
    const names = dogs.map(d => d.name).filter(Boolean);
    const sidebarEl = document.getElementById('sidebarPets');
    if (sidebarEl) {
      sidebarEl.innerHTML = dogs.map(d => {
        const info = [esc(d.breed), d.age ? esc(formatDogAge(d.age)) : ''].filter(Boolean).join(' • ');
        return '<div style="margin-bottom:10px;"><div class="pet-name">' + esc(d.name) + '</div><div class="pet-info">' + info + '</div></div>';
      }).join('');
    }
    const titleEl = document.getElementById('pageTitle');
    const subEl = document.getElementById('pageSubtitle');
    if (titleEl && titleEl.dataset.suffix !== undefined && names.length)
      titleEl.textContent = names.join(' & ') + titleEl.dataset.suffix;
    if (subEl && subEl.dataset.prefix !== undefined && names.length)
      subEl.textContent = subEl.dataset.prefix + names.join(' & ') + (subEl.dataset.suffix || '');

    // Load walks and overnight/check-in reservations in parallel, then
    // normalize both into the single allRecords shape the merged renderer
    // expects. Neither query is paginated/limited — this always loads the
    // member's ENTIRE history in one shot (pre-existing behavior for walks;
    // the new overnights query matches it) — so a deep link can never land
    // outside what's loaded. That's fine at today's volume, but it's an
    // unbounded read that will eventually need a real limit/cursor as
    // members accumulate years of history; this build didn't add that cap,
    // it just didn't make the existing gap any worse.
    const [walksSnap, overnightsSnap] = await Promise.all([
      getDocs(query(collection(db, 'walks'), where('memberId', '==', user.uid))),
      getDocs(query(collection(db, 'overnights'), where('memberId', '==', user.uid))),
    ]);

    const walkRecords = walksSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(w => w.status === 'completed')
      .map(w => {
        const duration = (w.extended ? '45-minute walk' : (w.duration || '30-minute walk')) + (w.extended && w.extendedStatus === 'pending' ? ' (pending confirmation)' : '');
        const slot = WALK_TIME_SLOT_LABELS[w.timeSlot] || w.timeSlot || '';
        return {
          type: 'walk',
          elementId: 'record-walk-' + w.id,
          sortDate: toJsDate(w.date),
          avatar: '🐾',
          walkerName: w.walkerName || 'Your Walker',
          subLabel: slot,
          badgeLabel: 'Dog Walk',
          note: w.notes || '',
          noNoteText: 'No notes for this walk.',
          photoUrl: w.photoUrl || null,
          metaLine: duration,
        };
      });

    // Each overnights doc can carry many individually-completed visits
    // (generateOvernightVisits, functions/index.js) — flatMap so every
    // completed visit becomes its own card, not one card per reservation.
    const visitRecords = overnightsSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .flatMap(o => {
        const isCheckin = o.serviceType === 'drop-in-visit' || o.serviceType === 'checkin';
        const serviceLabel = isCheckin ? 'Check-In Visit' : 'Overnight Stay';
        return (Array.isArray(o.visits) ? o.visits : [])
          .filter(v => v.status === 'completed')
          .map(v => ({
            type: 'visit',
            elementId: 'record-visit-' + o.id + '-' + v.id,
            sortDate: toJsDate(v.date),
            avatar: isCheckin ? '📍' : '🌙',
            walkerName: v.walkerName || o.walkerName || 'Your Walker',
            subLabel: VISIT_SLOT_LABELS[v.slot] || v.slot || '',
            badgeLabel: serviceLabel,
            note: v.note || '',
            noNoteText: 'No notes for this visit.',
            photoUrl: v.photoUrl || null,
            metaLine: serviceLabel,
          }));
      });

    allRecords = [...walkRecords, ...visitRecords];
    renderRecords('all');
  } catch(e) {
    console.error('care history load:', e.message);
    document.getElementById('walksContainer').innerHTML = '';
    showError("We couldn't load your care history. Please try again.", { onRetry: () => location.reload() });
  }
});
</script>
<script type="module" src="/js/portal-nav.js"></script>
</body>
</html>
