<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walk History - Port City Leash Club</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f5f3ed;
      color: #0D1B2A;
    }

    .portal-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #0D1B2A;
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .sidebar-logo {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      font-weight: 500;
      color: white;
      
      transition: opacity 0.2s;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      
      color: #8FA8A2;
      text-decoration: none;
      transition: all 0.2s;
      display: block;
      white-space: nowrap;
      line-height: 1.4;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      padding: 12px 12px;
      background: #C17B6F;
      color: white;
    }

    .sidebar-pet {
      border-top: 0.5px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      color: #8FA8A2;
      font-size: 13px;
    }

    .pet-name {
      margin-bottom: 8px;
      font-weight: 500;
    }

    .pet-info {
      font-size: 12px;
      opacity: 0.8;
    }

    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      max-width: 900px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 14px;
      color: #888;
    }

    /* Filter Buttons */
    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid #E5E0D8;
      background: white;
      border-radius: 6px;
      font-size: 13px;
      
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #C17B6F;
      color: white;
      border-color: #C17B6F;
    }

    /* Visit Report Card */
    .visit-report {
      background: #FAF8F4;
      border: 1px solid #E5E0D8;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(13, 27, 42, 0.04);
    }

    .report-header {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .walker-avatar {
      width: 56px;
      height: 56px;
      background: rgba(193, 123, 111, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }

    .walker-info {
      flex: 1;
    }

    .walker-name {
      font-weight: 600;
      font-size: 15px;
      color: #0D1B2A;
      margin-bottom: 2px;
    }

    .walker-role {
      font-size: 12px;
      color: #7A7A7A;
    }

    .walker-badge {
      font-size: 11px;
      background: rgba(193, 123, 111, 0.2);
      color: #C17B6F;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 4px;
      display: inline-block;
    }

    .report-date {
      text-align: right;
      font-size: 13px;
      color: #7A7A7A;
    }

    /* Report Content */
    .report-content {
      margin-bottom: 20px;
    }

    .report-text {
      font-size: 14px;
      color: #4A4A4A;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .report-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    .meta-item {
      font-size: 12px;
      color: #7A7A7A;
    }

    .meta-value {
      font-weight: 600;
      color: #0D1B2A;
      font-size: 14px;
    }

    /* Photos */
    .report-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .photo-item {
      aspect-ratio: 1;
      background: rgba(193, 123, 111, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      
      transition: all 0.2s;
    }

    .photo-item:hover {
      box-shadow: 0 4px 12px rgba(13, 27, 42, 0.1);
    }

    /* Notes */
    .report-notes {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #E5E0D8;
      font-size: 13px;
      color: #4A4A4A;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .notes-label {
      font-weight: 500;
      color: #0D1B2A;
      font-size: 12px;
      margin-bottom: 6px;
    }

    /* View Details Button */
    .view-details-btn {
      background: white;
      border: 1px solid #E5E0D8;
      padding: 10px 16px;
      border-radius: 6px;
      
      font-size: 13px;
      color: #0D1B2A;
      font-weight: 500;
      transition: all 0.2s;
    }

    .view-details-btn:hover {
      background: #FAF8F4;
      box-shadow: 0 2px 6px rgba(13, 27, 42, 0.08);
    }

    /* Empty State */
    .empty-state {
      background: #FAF8F4;
      border: 1px solid #E5E0D8;
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      color: #7A7A7A;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .report-meta {
        grid-template-columns: repeat(2, 1fr);
      }

      .report-photos {
        grid-template-columns: repeat(2, 1fr);
      }

      .filter-buttons {
        flex-wrap: wrap;
      }
    }
  
  /* ── PORTAL MOBILE ─────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    html, body { overflow-x: hidden; }

    /* Hide sidebar, expand main — the shared drawer (js/portal-nav.js)
       takes over navigation below this same breakpoint. */
    .sidebar { display: none !important; }
    .portal-container { display: block !important; }
    .main-content { margin-left: 0 !important; padding: 20px 16px !important; }
    .main { margin-left: 0 !important; }
    .content { padding: 20px 16px !important; }

    /* Cards + tables */
    .stats-row { grid-template-columns: 1fr 1fr !important; gap: 10px; }
    .stat-card { padding: 16px; }
    .stat-value { font-size: 28px; }
    table { font-size: 12px; }
    th, td { padding: 10px 10px; }
    .table-search { width: 100%; }
    .table-header { flex-direction: column; align-items: flex-start; gap: 10px; }

    /* Calendar */
    .calendar-day { min-height: 60px; padding: 4px; }
    .day-num { font-size: 11px; width: 20px; height: 20px; }
    .walk-chip { font-size: 9px; padding: 1px 3px; }
    .calendar-weekday { font-size: 9px; padding: 6px 2px; }
    .calendar-legend { flex-wrap: wrap; gap: 8px; }

    /* Forms */
    .form-grid { grid-template-columns: 1fr !important; }
    .form-field { grid-column: 1 !important; }
    .form-shell { grid-template-columns: 1fr !important; }
    .order-sidebar { position: static !important; }
    .summary-card { margin-top: 0; }

    /* Walk cards */
    .walk-card { padding: 14px 16px; gap: 12px; }
    .walk-date-day { font-size: 22px; }

    /* Membership upgrade */
    .plans-grid { grid-template-columns: 1fr !important; }
    .plan-option { padding: 18px; }

    /* Layout helpers */
    .layout { grid-template-columns: 1fr !important; }
    .form-section { padding: 20px 16px !important; }
    .page-header { margin-bottom: 20px; }
    .page-header h1 { font-size: 24px; }
  }

  .btn-signout {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5);
    border-radius: 4px;
    padding: 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-signout:hover { border-color: rgba(255,255,255,0.4); color: white; }
</style>
</head>
<body>
  <div class="portal-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-logo">The Leash Club</div>
      <nav class="sidebar-nav">
        <a href="portal-dashboard.html" class="nav-item">Dashboard</a>
        <a href="portal-pet-profile.html" class="nav-item">Pet Profile</a>
        <a href="portal-walk-history.html" class="nav-item active">Walk History</a>
        <a href="portal-extras.html" class="nav-item">Additional Care</a>
        <a href="portal-referrals.html" class="nav-item">Refer a Friend</a>
        <a href="portal-account.html" class="nav-item">Account</a>
      </nav>
      <div class="sidebar-pet">
        <div id="sidebarPets">
          <div class="pet-name" id="sidebarPetName">Scout</div>
          <div class="pet-info" id="sidebarPetInfo">Golden Retriever • 5 years old</div>
        </div>
      </div>
      <div style="margin-top:auto;">
        <button class="btn-signout" onclick="signOutMember()">Log Out</button>
        <a href="index.html" style="display:flex;justify-content:center;padding:16px 12px 20px;border-top:1px solid rgba(255,255,255,0.08);text-decoration:none;"><img src="../images/logo-square.png" alt="Port City Leash Club" style="height:auto;width:100%;max-width:93px;filter:invert(1) sepia(1) saturate(0.3) brightness(1.1);opacity:1;"></a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="page-header">
        <h1 id="pageTitle" data-suffix="'s Walk History">Your Pet's Walk History</h1>
        <p id="pageSubtitle" data-prefix="" data-suffix="'s completed walks and care updates">Your pet's completed walks and care updates</p>
      </div>

      <!-- Filter Buttons -->
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterWalks('all', this)">All walks</button>
        <button class="filter-btn" onclick="filterWalks('month', this)">This month</button>
        <button class="filter-btn" onclick="filterWalks('last-month', this)">Last month</button>
      </div>

      <div id="walksContainer">
        <div style="text-align:center;padding:48px 24px;color:#7A7A7A;font-size:14px;">Loading walk history…</div>
      </div>
    </div>
  </div>

  <script>
    let allWalks = [];

    // Walk notes are free text written by a walker (completeWalk() in
    // walker/dashboard.html) and rendered here via innerHTML — unescaped,
    // this is a stored-XSS path into a member's own browser the moment
    // they open Walk History. Same escaping convention as esc() in
    // walker/dashboard.html.
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    function filterWalks(period, button) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      renderWalks(period);
    }

    function renderWalks(period = 'all') {
      const container = document.getElementById('walksContainer');
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      let filtered = allWalks.filter(w => w.status === 'completed');

      if (period === 'month') {
        filtered = filtered.filter(w => {
          const d = w.date?.toDate?.() || new Date(w.date);
          return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
        });
      } else if (period === 'last-month') {
        const lm = currentMonth === 0 ? 11 : currentMonth - 1;
        const lmy = currentMonth === 0 ? currentYear - 1 : currentYear;
        filtered = filtered.filter(w => {
          const d = w.date?.toDate?.() || new Date(w.date);
          return d.getMonth() === lm && d.getFullYear() === lmy;
        });
      }

      filtered.sort((a, b) => {
        const da = a.date?.toDate?.() || new Date(a.date);
        const db = b.date?.toDate?.() || new Date(b.date);
        return db - da;
      });

      if (!filtered.length) {
        container.innerHTML = '<div style="text-align:center;padding:48px 24px;color:#7A7A7A;font-size:14px;">No completed walks yet.</div>';
        return;
      }

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const slotLabel = { morning: 'Morning', 'early-afternoon': 'Early Afternoon', 'late-afternoon': 'Late Afternoon' };

      container.innerHTML = filtered.map(w => {
        const date = w.date?.toDate?.() || new Date(w.date);
        const dateStr = monthNames[date.getMonth()] + ' ' + date.getDate() + ', ' + date.getFullYear();
        const duration = (w.extended ? '45-minute walk' : (w.duration || '30-minute walk')) + (w.extended && w.extendedStatus === 'pending' ? ' (pending confirmation)' : '');
        const slot = slotLabel[w.timeSlot] || w.timeSlot || '';
        return '<div class="visit-report" data-month="' + (date.getMonth()+1) + '" data-year="' + date.getFullYear() + '">' +
          '<div class="report-header">' +
          '<div class="walker-avatar">🐾</div>' +
          '<div class="walker-info">' +
          '<div class="walker-name">' + esc(w.walkerName || 'Your Walker') + '</div>' +
          '<div class="walker-role">' + slot + '</div>' +
          '</div>' +
          '<div class="report-date">' + dateStr + '</div>' +
          '</div>' +
          '<div class="report-content">' +
          (w.notes ? '<div class="report-text">' + esc(w.notes) + '</div>' : '<div class="report-text" style="color:#aaa;font-style:italic;">No notes for this walk.</div>') +
          '<div class="report-meta" style="margin-top:12px;font-size:13px;color:#7A7A7A;">' + duration + '</div>' +
          '</div>' +
          '</div>';
      }).join('');
    }
  </script>
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeAuth, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { initializeFirestore, memoryLocalCache, doc, getDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { showError } from '/js/status.js';
import { requireMemberDoc } from '/js/portal-guard.js';
const cfg = { apiKey:"AIzaSyCMP5mj12VkvaOeJ6CXFujycPjwFrD85RM", authDomain:"port-city-leash-club-827ab.firebaseapp.com", projectId:"port-city-leash-club-827ab", storageBucket:"port-city-leash-club-827ab.firebasestorage.app", messagingSenderId:"649385306352", appId:"1:649385306352:web:8e8a6fcbe8a7eff29dfa35" };
const app = getApps().find(a => a.name === 'member-app') || initializeApp(cfg, 'member-app');
// Explicit persistence fallback chain — the SDK's default hierarchy probes
// IndexedDB first, which hangs (never resolves, never rejects) under Safari
// Private Browsing instead of failing fast. This skips straight to
// localStorage-backed persistence, falling back further only if unavailable.
const auth = initializeAuth(app, {
  persistence: [browserLocalPersistence, browserSessionPersistence, inMemoryPersistence]
});
// Firestore already defaults to memory-only cache with no persistence
// configured; making it explicit documents the choice on purpose.
const db = initializeFirestore(app, { localCache: memoryLocalCache() });
window.signOutMember = () => signOut(auth).then(() => window.location.href = 'portal-login.html');

// If auth never resolves, stop waiting and tell the member instead of
// leaving the page stuck on "Loading walk history…".
let authResolved = false;
const authTimeoutId = setTimeout(() => {
  if (!authResolved) showError("This page didn't finish loading. Please try again.", { onRetry: () => location.reload() });
}, 10000);

onAuthStateChanged(auth, async (user) => {
  authResolved = true;
  clearTimeout(authTimeoutId);
  if (!user) { window.location.href = 'portal-login.html'; return; }
  const m = await requireMemberDoc(db, user.uid);
  if (!m) { document.getElementById('walksContainer').innerHTML = ''; return; }
  try {
    const dogs = m.dogs?.length ? m.dogs : [{ name: m.dogName, breed: m.petBreed, age: m.petAge ? m.petAge + ' years' : '' }];
    const names = dogs.map(d => d.name).filter(Boolean);
    const sidebarEl = document.getElementById('sidebarPets');
    if (sidebarEl) {
      sidebarEl.innerHTML = dogs.map(d => {
        const info = [esc(d.breed), d.age ? esc(d.age) + ' old' : ''].filter(Boolean).join(' • ');
        return '<div style="margin-bottom:10px;"><div class="pet-name">' + esc(d.name) + '</div><div class="pet-info">' + info + '</div></div>';
      }).join('');
    }
    const titleEl = document.getElementById('pageTitle');
    const subEl = document.getElementById('pageSubtitle');
    if (titleEl && titleEl.dataset.suffix !== undefined && names.length)
      titleEl.textContent = names.join(' & ') + titleEl.dataset.suffix;
    if (subEl && subEl.dataset.prefix !== undefined && names.length)
      subEl.textContent = subEl.dataset.prefix + names.join(' & ') + (subEl.dataset.suffix || '');

    // Load walks
    const walksSnap = await getDocs(query(collection(db, 'walks'), where('memberId', '==', user.uid)));
    window.allWalks = walksSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderWalks('all');
  } catch(e) {
    console.error('walk history load:', e.message);
    document.getElementById('walksContainer').innerHTML = '';
    showError("We couldn't load your walk history. Please try again.", { onRetry: () => location.reload() });
  }
});
</script>
<script type="module" src="/js/portal-nav.js"></script>
</body>
</html>
